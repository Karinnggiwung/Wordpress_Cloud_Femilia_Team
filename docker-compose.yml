services:

db:
image: mariadb:11
container_name: wordpress-db
restart: always
environment:
MYSQL_ROOT_PASSWORD: root123
MYSQL_DATABASE: wordpress
MYSQL_USER: wpuser
MYSQL_PASSWORD: wppassword
volumes:
- db_data:/var/lib/mysql
networks:
- backend-net

redis:
image: redis:latest
container_name: wordpress-redis
restart: always
networks:
- backend-net

minio:
image: minio/minio
container_name: wordpress-minio
restart: always
command: server /data --console-address ":9001"
environment:
MINIO_ROOT_USER: admin
MINIO_ROOT_PASSWORD: minio123
ports:
- "9000:9000"
- "9001:9001"
volumes:
- minio_data:/data
networks:
- backend-net

wordpress:
image: wordpress:latest
container_name: wordpress-app
restart: always
depends_on:
- db
- redis
- minio
ports:
- "8080:80"
environment:
WORDPRESS_DB_HOST: db:3306
WORDPRESS_DB_USER: wpuser
WORDPRESS_DB_PASSWORD: wppassword
WORDPRESS_DB_NAME: wordpress
volumes:
- wordpress_data:/var/www/html
networks:
- frontend-net
- backend-net

volumes:
db_data:
wordpress_data:
minio_data:

networks:
frontend-net:
backend-net:
